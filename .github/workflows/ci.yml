name: CI

# Job names below are required status checks on `master`. Keep them stable:
# renaming one silently disables the protection rule that requires it.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for credentials and runtime state
        run: scripts/repo-hygiene.sh

      - name: Lint shell scripts
        # The installer is the one artifact users run as root on their own
        # server, so it is linted like source rather than treated as glue.
        #
        # The runner image ships shellcheck. Installing it through apt on every
        # run added a package-index fetch that stalled indefinitely twice, so the
        # preinstalled binary is used and a missing one fails fast instead.
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck is not on this runner image" >&2
            exit 1
          fi
          shellcheck --version | head -2
          shellcheck --severity=warning scripts/*.sh

      - name: Test the VPS installer
        run: scripts/install-test.sh

      - name: Test the VPS installer as root
        # The same suite, run with the privilege a real installation has. It is
        # what actually exercises root ownership of the worker policy and the
        # worker template: unprivileged, the installer can only chown to the
        # account running it, and an assertion about `root:root` would be
        # checking a substitution rather than the thing that matters.
        #
        # Everything else the suite covers is identical either way, so this is a
        # second run rather than a separate suite.
        run: sudo scripts/install-test.sh

  node-runtime:
    name: Node runtime (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # The one live-Hermes test is `#[ignore]` and stays out of this run.
        run: cargo test

      - name: Build
        run: cargo build

  control-plane:
    name: Control Plane (backend)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Isolated CI-only credentials. This database is destroyed with the runner.
          POSTGRES_USER: asterism_ci
          POSTGRES_PASSWORD: asterism_ci
          POSTGRES_DB: asterism_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U asterism_ci -d asterism_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://asterism_ci:asterism_ci@127.0.0.1:5432/asterism_ci

    defaults:
      run:
        working-directory: control-plane

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.2'
          cache: npm
          cache-dependency-path: control-plane/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Install console dependencies for the live browser suite
        working-directory: control-plane/web
        run: npm ci

      - name: Build the console for the live browser suite
        working-directory: control-plane/web
        run: npm run build

      - name: Install Chromium
        working-directory: control-plane/web
        run: npx playwright install --with-deps chromium

      - name: Live browser tests
        # The real Control Plane serving the real console, a real signed Node
        # session, and this job's PostgreSQL. It runs here rather than in the
        # console job because that job deliberately installs no backend and has
        # no database.
        working-directory: control-plane/web
        run: npx playwright test --project=live

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Validate the production Compose stack
        # Resolves the production overlay and audits the result. Placeholder
        # values are supplied by the script, so this needs no real secret and
        # no deployment; it fails the build when the production shape regresses.
        working-directory: .
        run: scripts/check-production-config.sh

  web-console:
    name: Operations console (web)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: control-plane/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.2'
          cache: npm
          cache-dependency-path: control-plane/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mocked browser tests
        # No live variables are set, so the suite runs against its mock backend.
        # It never needs a real Control Plane, Node, Hermes, or provider account.
        # The live suite is deliberately absent here: it boots a real Control
        # Plane and needs PostgreSQL, so it runs in the backend job instead.
        run: npx playwright test --project=chromium

      - name: Audit dependencies
        run: npm audit --audit-level=high

name: Release

# Publishes the Asterism Node binary that `scripts/install.sh` downloads.
#
# The installer must never build Rust on a user's VPS: a compile toolchain is a
# large, slow, and unnecessary dependency, and a locally compiled binary is not
# reproducible. This workflow is the other half of that promise — one versioned
# `linux/amd64` artifact per tag, with a checksum the installer verifies before
# it installs anything.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  node-binary:
    name: Node binary (linux/amd64)
    runs-on: ubuntu-latest
    # Built inside Debian 11 on purpose. A binary linked on the runner's own
    # Ubuntu 24.04 requires GLIBC_2.39 and will not start on Debian 12 (2.36) or
    # Debian 11 (2.31) — both supported platforms. Building against the oldest
    # supported libc makes one artifact that runs on all of them; the reverse is
    # not true, and nothing at install time can repair it.
    container: debian:11
    defaults:
      run:
        # The container's default shell is dash, which has no `pipefail`. Every
        # step below assumes bash.
        shell: bash
    steps:
      - name: Install build prerequisites
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates build-essential pkg-config git python3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Refuse a tag that does not describe this build
        # A release whose artifact disagrees with its tag is worse than no
        # release: the installer would verify a checksum for the wrong version.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          crate="v$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          case "$tag" in
            "$crate"|"$crate"-*) ;;
            *)
              echo "tag $tag does not match crate version $crate" >&2
              exit 1
              ;;
          esac

      - name: Build
        run: cargo build --release --locked

      - name: Refuse a binary that will not start on a supported platform
        # The floor is asserted, not assumed: a toolchain or dependency change
        # can raise it silently, and the symptom is an installer that reports a
        # successful install of a binary that cannot execute.
        run: |
          set -euo pipefail
          floor=$(objdump -T target/release/asterism-node \
            | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
          echo "highest required symbol: $floor"
          case "$floor" in
            GLIBC_2.[0-9]|GLIBC_2.[0-2][0-9]|GLIBC_2.3[01]) ;;
            *)
              echo "binary requires $floor; Debian 11 provides 2.31" >&2
              exit 1
              ;;
          esac
          ./target/release/asterism-node --version

      - name: Package
        id: package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          name="asterism-node-${version}-linux-amd64"
          mkdir -p "dist/${name}"
          cp target/release/asterism-node "dist/${name}/"
          cp README.md SECURITY.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          # Checksums are computed over the archive the installer downloads, and
          # over the bare binary so an operator can verify either one.
          ( cd dist && sha256sum "${name}.tar.gz" "${name}/asterism-node" > SHA256SUMS )
          echo "archive=dist/${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Report checksums
        run: cat dist/SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.archive }}
            dist/SHA256SUMS
          # Every `-` qualified tag is a prerelease. Asterism has published no
          # stable release and must not imply one.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true

name: Runtime bundle

# Builds the runtime a host installs, once, from a named revision.
#
# Not on every pull request: it pulls a 1 GB image, builds a virtualenv and
# compiles SQLite, which takes long enough that running it per commit would buy
# nothing. It runs when asked, and on a release tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the manifest and archive name
        required: false
  # Called by the acceptance workflow, which needs a bundle built the way a
  # release builds one — on its own runner, because the build creates the service
  # account and the host being accepted must not already have it.
  workflow_call:
    inputs:
      version:
        type: string
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  bundle:
    name: Runtime bundle (linux/amd64)
    # A clean, disposable machine with real root and Docker. The bundle is built
    # where nothing else lives, so nothing else can end up in it.
    runs-on: ubuntu-24.04
    # Built inside Debian 11, for the reason `release.yml` builds the Node binary
    # there: the oldest supported platform sets the floor. The runtime carries
    # native Python extensions, and a wheel resolved against the runner's own
    # glibc 2.39 installs perfectly on Debian 11 and then refuses to import —
    # which is how a bundle claiming four supported platforms shipped working on
    # one. Debian 11 gives glibc 2.31, below every platform this project claims.
    #
    # The host's Docker socket comes in because the build extracts Hermes and the
    # Codex CLI from a pinned image and compiles the SQLite driver in a throwaway
    # container. There is no daemon inside this one.
    container:
      image: debian:11
      options: --user root -v /var/run/docker.sock:/var/run/docker.sock
    permissions:
      contents: write
      # Provenance is attested through GitHub's own OIDC identity rather than a
      # signing key someone has to hold. Nothing secret is needed to produce it,
      # and `gh attestation verify` checks it against this workflow.
      id-token: write
      attestations: write
    steps:
      - name: Install what the build needs
        # Debian 11 is deliberately bare. Only the Docker *client* is installed:
        # the daemon is the runner's, reached through the socket above.
        # `bash {0}` rather than the default `bash -e {0}`: this step has to be
        # able to report why it failed, and a shell that exits on the first error
        # reports nothing at all — which is what it did twice, leaving only
        # "exit code 2".
        shell: bash {0}
        run: |
          export DEBIAN_FRONTEND=noninteractive
          log=/tmp/prereq.log
          {
            echo "--- os ---"; cat /etc/os-release | head -3
            echo "--- apt-get update ---"
            apt-get -o Acquire::Retries=3 update 2>&1 | tail -5
            echo "--- apt-get install ---"
            # Retried, because a Debian mirror resetting a connection mid-download
            # is a fact of the internet and not a fact about this build. One
            # dropped `.deb` used to fail the whole bundle.
            for attempt in 1 2 3; do
              apt-get -o Acquire::Retries=3 install -y -qq \
                curl ca-certificates git python3 xz-utils tar gzip file binutils \
                build-essential pkg-config docker.io 2>&1 | tail -10
              command -v docker >/dev/null && break
              echo "attempt $attempt did not complete; retrying"
              sleep 5
            done
            echo "--- docker client ---"; docker --version 2>&1
            echo "--- docker daemon ---"; docker version --format '{{.Server.Version}}' 2>&1
          } > "$log" 2>&1
          status=$?
          tail -30 "$log"
          if [ "$status" != 0 ] || ! command -v docker >/dev/null; then
            printf '::error::%s%%0A%s\n' "installing the build prerequisites failed" \
              "$(tail -25 "$log" | sed -z 's/\n/%0A/g')"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Record the machine this was built on
        # Provenance, not a gate. Every value is best-effort: a build must not
        # fail because a description of the machine could not be produced, and
        # `pipefail` plus `ldd --version | head -1` did exactly that — `ldd` takes
        # SIGPIPE when `head` closes, and the step died recording a comment.
        shell: bash {0}
        run: |
          {
            echo "runner_os=$(. /etc/os-release 2>/dev/null && echo "$ID $VERSION_ID")"
            echo "kernel=$(uname -r)"
            echo "arch=$(uname -m)"
            echo "glibc=$(ldd --version 2>/dev/null | sed -n 1p)"
            echo "docker=$(docker --version 2>/dev/null)"
          } > build-environment.txt
          cat build-environment.txt

      - name: Create the service account the runtime is owned by
        # The bundle records ownership, so the account has to exist while it is
        # built. It is a system account with no shell, exactly as on a host.
        # No `sudo`: this job runs as root inside its own container, and a bare
        # Debian has no sudo to find — which is what "exit code 127" was.
        run: useradd --system --user-group --no-create-home --shell /usr/sbin/nologin asterism

      - name: Resolve the version
        id: version
        shell: bash {0}
        run: |
          # `git` inside a container refuses a checkout it considers to belong to
          # someone else, and this step is the first that asks it anything.
          git config --global --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME:-}"
          case "$version" in
            refs/*|"") version="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)" ;;
          esac
          if [ -z "$version" ] || [ "$version" = unknown ]; then
            printf '::error::%s\n' "could not work out which version to build"
            exit 1
          fi
          echo "resolved version: $version"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build the bundle
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -o pipefail
          scripts/build-runtime-bundle.sh dist "${{ steps.version.outputs.value }}" \
            2>&1 | tee build.log

      - name: Say what failed
        # The build is long and its log is large. When it fails, the last lines
        # are raised as annotations so the reason is visible from the run itself
        # rather than only inside a log archive someone has to download.
        if: failure()
        run: |
          # One annotation, not one per line: a step is capped at ten
          # annotations, and a cap that silently drops the tail of a failure
          # hides exactly the lines worth reading. `%0A` is how a single
          # annotation carries newlines.
          printf '::error::%s\n' "$(tail -40 build.log | sed -z 's/\n/%0A/g')"

      - name: Verify the manifest describes what was built
        run: scripts/verify-runtime-bundle.sh dist

      - name: Attest where this came from
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/asterism-runtime-*.tar.gz

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: asterism-runtime-${{ steps.version.outputs.value }}-linux-amd64
          path: |
            dist/
            build-environment.txt
          if-no-files-found: error
          retention-days: 14


  portability:
    name: The runtime starts on ${{ matrix.platform }}
    needs: bundle
    runs-on: ubuntu-24.04
    # Every platform `docs/installation.md` claims, tested by unpacking the
    # archive that was just built and asking the runtime to start.
    #
    # This is the check that was missing. A bundle built on the runner's own
    # Ubuntu installed perfectly on Debian 11 and then could not import a single
    # native extension, because its wheels were resolved against a newer libc.
    # Nothing before this point could notice: the checksum matched, the manifest
    # matched, the unpack succeeded, and the failure arrived only when systemd
    # tried to start Hermes on somebody's server.
    strategy:
      fail-fast: false
      matrix:
        platform:
          - debian:11
          - debian:12
          - ubuntu:22.04
          - ubuntu:24.04
    steps:
      - name: Collect the bundle that was just built
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Unpack it and ask the runtime to start
        run: |
          set -euo pipefail
          archive=$(find downloaded -name 'asterism-runtime-*.tar.gz' | sort | sed -n 1p)
          [ -n "$archive" ] || { echo "no bundle to test" >&2; exit 1; }
          echo "testing $(basename "$archive") on ${{ matrix.platform }}"
          docker run --rm -v "$PWD/$archive:/bundle.tar.gz:ro" ${{ matrix.platform }} sh -c '
            set -e
            echo "  host: $(. /etc/os-release && echo "$PRETTY_NAME")"
            echo "  libc: $(ldd --version 2>/dev/null | sed -n 1p)"
            mkdir -p /opt
            # Packed from /opt, so its members are `asterism/...`. Extracting at
            # / would put the tree somewhere none of its own absolute paths point.
            tar -C /opt -xzf /bundle.tar.gz
            # Hermes itself, bounded. A hand-picked list of imports is not the
            # test: `sqlite3`, `ssl` and `hashlib` all load on a host where this
            # runtime cannot start, and the dependency that actually failed —
            # `cryptography`, reached through Hermes own module graph — was on
            # nobody list. Starting the launcher asks the real question.
            timeout 90 /opt/asterism/hermes/.venv/bin/hermes --help > /dev/null
            echo "  hermes starts"
            /opt/asterism/hermes/.venv/bin/python -c "
          import sqlite3
          print(\"  sqlite\", sqlite3.__name__, sqlite3.sqlite_version)
          "
            # And the thing a project actually runs, which links its own Node.js.
            timeout 60 /opt/asterism/codex/bin/codex --version
          '

  publish:
    name: Publish the bundle
    # Both, deliberately. The archive existing and its manifest matching is not
    # the same as it working: the bundle that took a production Hermes down was
    # correctly built, correctly checksummed, correctly described — and could not
    # start on half the platforms the documentation promises. Publishing waits
    # for the matrix that asks.
    needs: [bundle, portability]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Collect what was built and tested
        uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Publish it on the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            downloaded/**/asterism-runtime-*.tar.gz
            downloaded/**/manifest.json
            downloaded/**/SHA256SUMS.runtime
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

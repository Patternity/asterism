[package]
name = "asterism-node"
version = "0.1.0"
edition = "2024"
description = "Asterism host node architecture proof"
# No software license has been selected for Asterism. Cargo has no SPDX token
# meaning "no rights granted", so the field is omitted rather than guessed, and
# publishing is refused outright — crates.io would require a license this
# project has not chosen.
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
getrandom = "0.2"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "net",
    "signal",
    "sync",
    "io-util",
    # The provider login is a child process this reads line by line while it runs.
    "process",
] }
tokio-tungstenite = { version = "0.24", default-features = false, features = [
    "connect",
    "handshake",
    "rustls-tls-native-roots",
] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
